name: Release

# 手动触发发布。只需填一个 `tag`（如 v1.0.0）：
#   有值 → 构建后发布到该 tag 的 GitHub Release，版本名 = 该输入 + 9 位 commit hash
#   留空 → 仅测试打包（beta 形态），不发 Release，产物在 Actions 页面下载
#
# `release_label` 决定这条 Release 在 GitHub 上的标记，与 App 的两个更新渠道一一对应：
#   latest     → 标为 **Latest**，注入渠道 release，只有「稳定版」能收到
#   prerelease → 标为 **Pre-release**，注入渠道 beta，只有「测试版」能收到
# 两者可同时存在于同一仓库：稳定版渠道按 `prerelease != true` 过滤，互不干扰。
# 「只想出个测试包、不发 Release」不需要额外选项 —— `tag` 留空即是。
#
# 版本号规则（对齐 PiliPlus）：
#   - 版本名：`tag` 输入去掉 v 前缀，再追加 9 位 commit hash；
#     **留空 → beta 形态**（固定 1.0.0-beta / 1，Android 另切成 .beta 独立应用，与正式版共存）
#   - build 号：git 提交总数（scripts/version.ps1 计算）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（如 v1.0.0）；留空 → 仅测试打包（beta 形态，不发 Release）'
        required: false
        default: ''
        type: string
      build_android:
        description: '构建 Android APK（arm64-v8a / armeabi-v7a / x86_64）'
        required: false
        default: true
        type: boolean
      build_windows:
        description: '构建 Windows 安装包（exe + 便携 zip）'
        required: false
        default: true
        type: boolean
      release_label:
        description: '发布标签：latest → 标为 Latest（稳定版渠道）/ prerelease → 标为 Pre-release（测试版渠道）'
        required: false
        default: latest
        type: choice
        options:
          - latest
          - prerelease
      sign_mode:
        description: 'Android 签名方式：signed（仅签名）/ unsigned（仅未签名）/ both（两者同发，默认）'
        required: false
        default: both
        type: choice
        options:
          - both
          - signed
          - unsigned

  # 允许从命令行/脚本触发（curl / gh / CI 互相调用），方便本地调试与自动化。
  # 载荷字段与 workflow_dispatch 的 inputs 同名：tag / build_android / build_windows /
  # release_label / sign_mode。
  # 网页按钮走 workflow_dispatch，行为不受影响。
  repository_dispatch:
    types: [release]

jobs:
  android:
    name: Android APK
    if: ${{ (github.event.inputs.build_android || github.event.client_payload.build_android) == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 迁出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: 生成版本信息
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
          INPUT_LABEL: ${{ github.event.inputs.release_label || github.event.client_payload.release_label || 'latest' }}
        run: |
          # 发布标签决定注入给 App 的更新渠道（与 App 的两个渠道一一对应）：
          #   latest     → release（稳定版渠道只接受未打 prerelease 的发布）
          #   prerelease → beta   （测试版渠道接受 prerelease 标记的发布）
          # `tag` 留空 = 只出测试包（beta 形态，不发 Release），此时一律注入 beta：
          # 该形态的 Android 包是独立应用（包名带 .beta），走 release 渠道只会
          # 检出一个装不上的包；Windows 侧同理，保持两端口径一致。
          #
          # 归一化与 App 的 UpdateConfig.parseChannel 完全相同（去分隔符/忽略大小写），
          # 这样 curl 触发时写 `Pre-release` / `pre-release` 都不会被误判成稳定版。
          $label = ($env:INPUT_LABEL).Trim().ToLowerInvariant() -replace '[-_\s]', ''
          if ([string]::IsNullOrWhiteSpace($label)) {
            # 没传或传空 → 按 latest；保证 RELEASE_LABEL 永不为空，
            # 后面发布步骤的 `!= 'prerelease'` 才不会落到含糊的中间态。
            $label = 'latest'
          } elseif ($label -notin @('latest', 'prerelease')) {
            Write-Host "::warning::未识别的 release_label=$($env:INPUT_LABEL)，按 latest 处理"
            $label = 'latest'
          }
          # 归一化结果写进 GITHUB_ENV，供后面的「发布到 GitHub Release」直接读：
          # Actions 表达式里没有 replace()，原始输入若写成 `Pre-release` 会判成
          # 「非 prerelease」→ 悄悄变成 Latest。归一化只在 PowerShell 里做一次。
          "RELEASE_LABEL=$label" | Add-Content -Path $env:GITHUB_ENV
          $channel = if ($label -eq 'prerelease' -or [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { 'beta' } else { 'release' }
          Write-Host "release_label=$($env:INPUT_LABEL) → 注入渠道 $channel"
          if ([string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            scripts/version.ps1 android -Beta -Repo ${{ github.repository }} -Channel $channel
          } else {
            scripts/version.ps1 android -VersionName $env:INPUT_TAG -Repo ${{ github.repository }} -Channel $channel
          }

      - name: 写入签名（可选，配置无效自动跳过 → MT 内置签名）
        shell: pwsh
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          try {
            if (-not $env:SIGN_KEYSTORE_BASE64) { throw '未配置 SIGN_KEYSTORE_BASE64' }
            # 去掉 base64 中的空白/换行，避免粘贴多行内容导致解码失败
            $bytes = [Convert]::FromBase64String(($env:SIGN_KEYSTORE_BASE64 -replace '\s', ''))
            if ($bytes.Length -eq 0) { throw 'keystore base64 内容为空' }
            if (-not $env:KEYSTORE_PASSWORD -or -not $env:KEY_ALIAS -or -not $env:KEY_PASSWORD) {
              throw '缺少 KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD 之一'
            }
            [IO.File]::WriteAllBytes('android/app/key.jks', $bytes)
            # 用 .NET 无 BOM 写入，避免 Java Properties 读不到 storeFile
            $lines = @(
              "storeFile=key.jks",
              "storePassword=$env:KEYSTORE_PASSWORD",
              "keyAlias=$env:KEY_ALIAS",
              "keyPassword=$env:KEY_PASSWORD"
            )
            [IO.File]::WriteAllLines('android/key.properties', $lines, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host '已写入 key.properties（正式签名）'
          } catch {
            Remove-Item android/app/key.jks -ErrorAction SilentlyContinue
            Remove-Item android/key.properties -ErrorAction SilentlyContinue
            Write-Host "签名配置无效，跳过并回退 MT 内置签名: $($_.Exception.Message)"
          }

      - name: 构建 APK
        env:
          # beta 形态：gradle 按 dart-define 切成 .beta 独立应用（独立 appId/应用名/签名）
          BETA_FLAG: ${{ env.MTBBS_BETA == 'true' && '--dart-define=BETA=true' || '' }}
          # 签名三选项（sign_mode 输入）：signed / unsigned / both（默认）
          SIGN_MODE: ${{ github.event.inputs.sign_mode || github.event.client_payload.sign_mode || 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          build_once() {
            local unsigned_flag="$1"
            flutter build apk --release --split-per-abi \
              --dart-define-from-file=mtbbs_release.json \
              --build-name=${{ env.MTBBS_VERSION_NAME }} \
              --build-number=${{ env.MTBBS_VERSION_CODE }} \
              $BETA_FLAG $unsigned_flag
          }
          if [ "$SIGN_MODE" = "unsigned" ]; then
            build_once "--dart-define=UNSIGNED=true"
          elif [ "$SIGN_MODE" = "signed" ]; then
            build_once ""
          else
            # both：先出签名包并挪走，再出未签名包，避免同名产物互相覆盖
            build_once ""
            mkdir -p build/signed
            for f in build/app/outputs/flutter-apk/app-*-release.apk; do
              [ -e "$f" ] || continue
              mv "$f" "build/signed/$(basename "$f")"
            done
            build_once "--dart-define=UNSIGNED=true"
            mkdir -p build/unsigned
            for f in build/app/outputs/flutter-apk/app-*-release.apk; do
              [ -e "$f" ] || continue
              mv "$f" "build/unsigned/$(basename "$f")"
            done
            for f in build/signed/app-*-release.apk; do
              [ -e "$f" ] || continue
              mv "$f" "build/app/outputs/flutter-apk/$(basename "$f")"
            done
          fi

      - name: 重命名与签名校验
        shell: bash
        env:
          # 与「构建 APK」步骤保持同一套语义：signed / unsigned / both（默认）
          SIGN_MODE: ${{ github.event.inputs.sign_mode || github.event.client_payload.sign_mode || 'both' }}
        run: |
          set -euo pipefail
          # ------------------------------------------------------------------
          # 为什么需要这一步
          # ------------------------------------------------------------------
          # AGP 在 buildType 未配置 signingConfig 时产出的确实是「未签名 APK」，
          # 但打包流程仍可能残留两类结构，让第三方工具（MT 管理器等）误报
          # 「有 v2 签名」：
          #   1. META-INF/*.SF、*.RSA、*.DSA、*.EC —— v1(JAR) 签名文件；
          #   2. APK Signing Block（魔数 "APK Sig Block 42"）—— v2/v3 签名块，
          #      未签名时可能是空占位块。
          #
          # apksigner verify 是唯一权威判据：只有存在**真实签名者**才返回 0，
          # 空占位块一律 DOES NOT VERIFY。所以本步骤以它为准：
          #   签名包   → 必须 verify 通过，否则 fail（绝不发布坏包）
          #   未签名包 → 必须 verify 不通过；若残留痕迹，剥离后重新对齐再校验
          #
          # 注意：不要用 `zip` 重打包。Python 标准库 zipfile 只输出
          # 「本地头 + 数据 + 中央目录 + EOCD」，天然不会写回 APK Signing Block，
          # 比 zip 更彻底；实现见 scripts/strip_apk_signature.py。
          # ------------------------------------------------------------------

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          [ -n "$BUILD_TOOLS" ] || { echo "::error::未找到 build-tools"; exit 1; }
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          echo "sign_mode = $SIGN_MODE"
          echo "build-tools = $BUILD_TOOLS"

          is_signed() { "$APKSIGNER" verify "$1" >/dev/null 2>&1; }

          # 彻底剥离签名痕迹，并重新做 4 字节对齐（-p 保证 .so 页对齐）
          strip_signature() {
            local apk="$1"
            # 探测 zipalign 是否真的能执行：不能只看 `[ -x ]`（架构不匹配时文件有
            # 执行位但跑不起来），也不能看某个参数是否返回 0（zipalign 不认 -h，
            # build-tools 37.0.0 上 `zipalign -h` 返回 1，会被误判成"无法执行"）。
            # 唯一可靠的判据是退出码 126（不可执行）/ 127（找不到命令）。
            local rc=0
            "$ZIPALIGN" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 126 ] || [ "$rc" -eq 127 ]; then
              echo "::error::zipalign 无法执行（$ZIPALIGN，退出码 $rc）。剥离签名后必须重新对齐，否则 .so 页对齐失效、APK 可能无法安装。"
              exit 1
            fi
            echo "  剥离签名痕迹: $apk"
            python3 scripts/strip_apk_signature.py "$apk"
            # Python zipfile 重打包会破坏 4 字节对齐，必须重新 zipalign。
            "$ZIPALIGN" -p -f 4 "$apk" "$apk.aligned"
            mv -f "$apk.aligned" "$apk"
            if ! "$ZIPALIGN" -c -p 4 "$apk" >/dev/null 2>&1; then
              echo "::error::$apk 重新对齐后仍不满足 4 字节对齐"
              exit 1
            fi
            echo "  已重新对齐并通过 zipalign -c 校验"
          }

          # 列出指定目录下的 APK（目录不存在时静默跳过）
          list_apks() {
            local d
            for d in "$@"; do
              [ -d "$d" ] || continue
              find "$d" -maxdepth 1 -type f -name 'app-*-release.apk' 2>/dev/null
            done
          }

          abi_of() { echo "$1" | sed -E 's|.*app-(.*)-release\.apk|\1|'; }

          # 按 sign_mode 决定「哪些目录应含签名包、哪些应含未签名包」。
          # both 模式下构建步骤已把签名包挪回 flutter-apk、未签名包留在 build/unsigned。
          case "$SIGN_MODE" in
            signed)   SIGNED_DIRS=(build/app/outputs/flutter-apk) ;;
            unsigned) UNSIGNED_DIRS=(build/app/outputs/flutter-apk) ;;
            *)        SIGNED_DIRS=(build/app/outputs/flutter-apk build/signed)
                      UNSIGNED_DIRS=(build/unsigned) ;;
          esac

          produced=0

          # ---- 签名包：必须真的签了名 ----
          for dir in "${SIGNED_DIRS[@]}"; do
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              abi="$(abi_of "$file")"
              target="MTBBS_android_${{ env.MTBBS_VERSION }}_${abi}.apk"
              mv -f "$file" "$target"
              if is_signed "$target"; then
                echo "OK  签名包 $target（abi=$abi）"
                produced=$((produced + 1))
              else
                echo "::error::$target 应有签名，但 apksigner verify 未通过（构建出的包不可用于发布）"
                exit 1
              fi
            done < <(list_apks "$dir")
          done

          # ---- 未签名包：必须真的没有签名 ----
          for dir in "${UNSIGNED_DIRS[@]:-}"; do
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              abi="$(abi_of "$file")"
              target="MTBBS_android_${{ env.MTBBS_VERSION }}_${abi}_unsigned.apk"
              mv -f "$file" "$target"

              if is_signed "$target"; then
                echo "检测到 $target 残留签名/占位块，剥离并重新对齐"
                strip_signature "$target"
              fi

              if is_signed "$target"; then
                echo "::error::$target 剥离后仍能通过 apksigner verify，未签名包不干净"
                exit 1
              fi
              echo "OK  未签名包 $target（apksigner verify 确认无签名）"
              produced=$((produced + 1))
            done < <(list_apks "$dir")
          done

          if [ "$produced" -eq 0 ]; then
            echo "::error::未产出任何 APK（sign_mode=$SIGN_MODE）"
            exit 1
          fi
          echo "共校验 $produced 个 APK，sign_mode=$SIGN_MODE"
          ls -la MTBBS_android_*.apk

      - name: 输出产物摘要与 Hash（溯源）
        shell: pwsh
        run: scripts/artifact_summary.ps1 -Title 'Android APK' -Patterns 'MTBBS_android_*.apk'

      - name: 发布到 GitHub Release
        # `tag` 留空 = 只出测试包，不发 Release
        if: ${{ (github.event.inputs.tag || github.event.client_payload.tag) != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
          name: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
          # release_label 直连 GitHub 的两种标记，App 的两个更新渠道各取所需：
          #   latest     → 不带 prerelease，且显式 make_latest=true（抢占 Latest 角标）
          #   prerelease → 带 prerelease，App 的「稳定版」渠道会按此字段过滤掉它
          # 因此同一 tag 重建、或正式版/预览版混发，都不会把 Latest 角标弄错。
          #
          # 读 env.RELEASE_LABEL（「生成版本信息」步骤归一化后写入 GITHUB_ENV）而不是
          # 原始 input：表达式里没有 replace()，`Pre-release` 这种写法会被判成
          # 「非 prerelease」→ 悄悄变成 Latest。该值不会被写成空串（归一化时已兜底
          # 成 latest），所以不会出现「两个都是 false、角标不更新」的中间态。
          prerelease: ${{ env.RELEASE_LABEL == 'prerelease' }}
          make_latest: ${{ env.RELEASE_LABEL != 'prerelease' }}
          files: MTBBS_android_*.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          # archive:false 只允许单文件，3 个 ABI 的 APK 需走默认打包（zip）。
          # 正式发布仍由 softprops 逐个上传独立 APK，不受影响
          name: Android-APK
          path: MTBBS_android_*.apk

  windows:
    name: Windows 安装包
    if: ${{ (github.event.inputs.build_windows || github.event.client_payload.build_windows) == 'true' }}
    # 工具链对齐：插件 flutter_inappwebview 6.x 官方支持基线为 VS2022（MSVC 14.4x）；
    # windows-2022 镜像 = VS2022 17.14 + SDK 10.0.22621 + 预装 Inno Setup 6.7.1。
    # 不要用 windows-latest（已切到 VS2026/MSVC 14.51，会触发 STL1011 硬错误）。
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: 迁出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 添加中文语言文件（仓库内置，拷贝到 Inno Setup）
        shell: pwsh
        run: |
          # ChineseSimplified.isl 属于非官方翻译，官方安装包/choco 包均不附带，随仓库内置。
          # 注意：choco 的 iscc 是 Chocolatey shim，Get-Command iscc 取不到真实安装目录，
          # 必须硬编码官方安装路径（iscc 编译时读取 Languages 的目录）
          $langDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          New-Item -ItemType Directory -Force -Path $langDir | Out-Null
          Copy-Item 'installer/ChineseSimplified.isl' (Join-Path $langDir 'ChineseSimplified.isl') -Force
          if (-not (Test-Path (Join-Path $langDir 'ChineseSimplified.isl'))) {
            throw '中文语言文件拷贝失败'
          }
          Write-Host "已拷贝 ChineseSimplified.isl -> $langDir"

      - name: 生成版本信息
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
          INPUT_LABEL: ${{ github.event.inputs.release_label || github.event.client_payload.release_label || 'latest' }}
        run: |
          # 与 Android 完全同口径：prerelease 或 tag 留空（仅测试包）→ beta，其余 → release。
          # 注：改动前这里写死 `release`，导致预览版的 Windows 包被注入成稳定版渠道、
          # 去比对 Latest 发布，永远检不到自己的预览版。
          $label = ($env:INPUT_LABEL).Trim().ToLowerInvariant() -replace '[-_\s]', ''
          if ([string]::IsNullOrWhiteSpace($label)) {
            # 没传或传空 → 按 latest；保证 RELEASE_LABEL 永不为空，
            # 后面发布步骤的 `!= 'prerelease'` 才不会落到含糊的中间态。
            $label = 'latest'
          } elseif ($label -notin @('latest', 'prerelease')) {
            Write-Host "::warning::未识别的 release_label=$($env:INPUT_LABEL)，按 latest 处理"
            $label = 'latest'
          }
          # 同 Android：归一化结果写进 GITHUB_ENV，供发布步骤读（表达式里没法 replace）
          "RELEASE_LABEL=$label" | Add-Content -Path $env:GITHUB_ENV
          $channel = if ($label -eq 'prerelease' -or [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { 'beta' } else { 'release' }
          Write-Host "release_label=$($env:INPUT_LABEL) → 注入渠道 $channel"
          if ([string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            scripts/version.ps1 -Beta -Repo ${{ github.repository }} -Channel $channel
          } else {
            scripts/version.ps1 -VersionName $env:INPUT_TAG -Repo ${{ github.repository }} -Channel $channel
          }

      - name: 构建 Windows Release
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define-from-file=mtbbs_release.json `
            --build-name=$env:MTBBS_VERSION_NAME `
            --build-number=$env:MTBBS_VERSION_CODE

      - name: 生成安装包（Inno Setup）
        shell: pwsh
        run: |
          iscc installer\setup.iss
          # 必须用 ${env:XXX} 包起来：`$env:MTBBS_VERSION_x64` 会被 PowerShell 整体当作
          # 变量名（下划线是合法标识符），解析为空 → 文件名退化成 MTBBS_windows_.exe
          Move-Item build\MTBBS_*_Setup.exe "MTBBS_windows_${env:MTBBS_VERSION}_x64_setup.exe"

      - name: 打包便携版
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "MTBBS_windows_${env:MTBBS_VERSION}_x64_portable.zip"

      - name: 输出产物摘要与 Hash（溯源）
        shell: pwsh
        run: scripts/artifact_summary.ps1 -Title 'Windows 安装包' -Patterns 'MTBBS_windows_*.exe','MTBBS_windows_*.zip'

      - name: 发布到 GitHub Release
        # `tag` 留空 = 只出测试包，不发 Release
        if: ${{ (github.event.inputs.tag || github.event.client_payload.tag) != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
          name: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
          # 同 Android：latest → Latest 角标；prerelease → Pre-release 标记
          # （读「生成版本信息」归一化后写入 GITHUB_ENV 的 RELEASE_LABEL）
          prerelease: ${{ env.RELEASE_LABEL == 'prerelease' }}
          make_latest: ${{ env.RELEASE_LABEL != 'prerelease' }}
          files: |
            MTBBS_windows_*.exe
            MTBBS_windows_*.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          # 同上：archive:false 只允许单文件，exe+zip 两个产物需走默认打包
          name: Windows-x64
          path: |
            MTBBS_windows_*.exe
            MTBBS_windows_*.zip
